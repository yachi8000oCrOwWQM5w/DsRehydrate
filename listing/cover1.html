<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#f5f4f1;color:#1e1d1b;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{padding:84px 82px 70px;height:100%;display:flex;flex-direction:column}
.tag{display:inline-block;font-size:23px;color:#2e6b5a;background:#e8f0ec;border:1px solid #cfe0d8;
  padding:10px 20px;border-radius:999px;letter-spacing:.02em}
h1{font-size:98px;line-height:1.16;font-weight:700;letter-spacing:-.03em;margin-top:54px}
h1 em{font-style:normal;color:#2e6b5a}
.sub{font-size:33px;line-height:1.62;color:#5f5b54;margin-top:40px}
.grow{flex:1}
.chips{display:flex;gap:13px;flex-wrap:wrap}
.chip{font-size:24px;color:#3c3a36;border:1px solid #d5d0c6;background:#fff;border-radius:12px;padding:14px 21px}
.note{font-size:22px;color:#a9a49b;margin-top:24px;letter-spacing:.01em}
.rule{height:1px;background:#e4e0d9;margin:0 0 26px}
</style></head><body>
<div class="wrap">
  <div><span class="tag">本地处理 · 不碰你的账号</span></div>
  <h1>你养了半年的她<br><em>还能接着聊</em></h1>
  <div class="sub">DeepSeek 长对话搬家<br>设定、记忆、聊天记录、图片附件，一起搬过去</div>
  <div class="grow"></div>
  <div class="rule"></div>
  <div class="chips">
    <div class="chip">1327 条实测</div>
    <div class="chip">附件原图</div>
    <div class="chip">当天交付</div>
  </div>
  <div class="note">不是教你复制粘贴，是让她在新窗口里还是她。</div>
</div>
</body></html>
