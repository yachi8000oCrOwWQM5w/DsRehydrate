<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#f5f4f1;color:#1e1d1b;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{padding:78px 80px 66px;height:100%;display:flex;flex-direction:column}
.head{font-size:60px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:26px;color:#7b7770;margin-top:16px}
.steps{margin-top:54px}
.step{display:flex;align-items:flex-start;gap:26px;padding:24px 0;border-bottom:1px solid #e4e0d9}
.step:last-child{border-bottom:0}
.num{width:62px;height:62px;flex:none;border-radius:16px;background:#2e6b5a;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:700}
.st{font-size:34px;font-weight:600;line-height:1.3}
.sd{font-size:24px;color:#7b7770;margin-top:8px;line-height:1.55}
.grow{flex:1}
.bar{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e4e0d9;padding-top:26px}
.badges{display:flex;gap:12px}
.b{font-size:22px;color:#3c3a36;border:1px solid #d5d0c6;background:#fff;border-radius:10px;padding:11px 17px}
.price{text-align:right}
.price .p{font-size:44px;font-weight:700;color:#2e6b5a;line-height:1}
.price .pl{font-size:20px;color:#a9a49b;margin-top:6px}
</style></head><body>
<div class="wrap">
  <div class="head">四步，把她搬回家</div>
  <div class="sub">全程你自己看着，数据不出你的电脑</div>
  <div class="steps">
    <div class="step">
      <div class="num">01</div>
      <div><div class="st">在官网导出历史</div>
        <div class="sd">设置 → 数据管理 → 导出所有历史对话，拿到一个 ZIP</div></div>
    </div>
    <div class="step">
      <div class="num">02</div>
      <div><div class="st">选对话，扫一遍</div>
        <div class="sd">自动列出所有会话，按条数排序，找出养得最久的那条</div></div>
    </div>
    <div class="step">
      <div class="num">03</div>
      <div><div class="st">补人设和记忆锚点</div>
        <div class="sd">把她的设定写回去，标好不能忘的事，这才是「还是她」的关键</div></div>
    </div>
    <div class="step">
      <div class="num">04</div>
      <div><div class="st">填 API Key，接着聊</div>
        <div class="sd">之后按量付费，几块钱能聊很久，不再看额度脸色</div></div>
    </div>
  </div>
  <div class="grow"></div>
  <div class="bar">
    <div class="badges"><div class="b">本地运行</div><div class="b">附件全带</div><div class="b">可导出酒馆</div></div>
    <div class="price"><div class="p">19.9 起</div><div class="pl">含远程协助</div></div>
  </div>
</div>
</body></html>
