<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#f2f6f4;overflow:hidden;display:flex;flex-direction:column;
  font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{padding:76px 72px 0;flex:1;min-height:0;display:flex;flex-direction:column}
.badge{display:inline-block;font-size:21px;color:#2e6b5a;background:#e2efe9;border:1px solid #c6ddd3;
  padding:9px 18px;border-radius:8px;letter-spacing:.04em;align-self:flex-start}
h1{font-size:68px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin-top:34px}
.sub{font-size:24px;color:#6b7a74;line-height:1.6;margin-top:18px}
.en{font-size:19px;color:#a6b3ad;letter-spacing:.14em;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:44px}
.card{background:#fff;border:1px solid #e2e9e5;border-radius:14px;padding:24px 22px}
.card .t{font-size:27px;font-weight:600;color:#1e1d1b;display:flex;align-items:center;gap:10px}
.card .t i{width:9px;height:9px;background:#2e6b5a;border-radius:2px;display:inline-block}
.card .d{font-size:21px;color:#7b8884;line-height:1.55;margin-top:10px}
.flows{display:flex;align-items:center;gap:14px;margin-top:34px}
.flow{background:#e6efeb;border:1px solid #d3e2da;border-radius:10px;padding:13px 15px;font-size:21px;color:#33473f;white-space:nowrap}
.flow b{color:#2e6b5a;font-weight:700;margin-right:7px}
.fa{color:#9fb3ab;font-size:20px}
.grow{flex:1}
.bar{flex:none;width:100%;height:116px;background:#12211f;display:flex;
  align-items:center;justify-content:space-between;padding:0 74px}
.bl{font-size:25px;color:#dfe9e4}
.bl b{color:#8fd0b6;font-weight:600;font-size:29px}
.br{font-size:22px;color:#8fb9a9;text-align:right;line-height:1.4}
</style></head><body>
<div class="wrap">
  <div class="badge">远程协助 · 当天交付</div>
  <h1>DeepSeek 聊天记录<br>导出与迁移</h1>
  <div class="sub">你手上那个 ZIP，我把它变成能接着聊的窗口</div>
  <div class="en">DEEPSEEK CHAT MIGRATION</div>

  <div class="grid">
    <div class="card"><div class="t"><i></i>按会话挑选</div><div class="d">自动列出全部对话，按条数排序</div></div>
    <div class="card"><div class="t"><i></i>只留主线</div><div class="d">重新生成的废稿不混进正文</div></div>
    <div class="card"><div class="t"><i></i>附件原图</div><div class="d">图片和文档一起搬，不留缩略图</div></div>
    <div class="card"><div class="t"><i></i>本地运行</div><div class="d">不上传，不碰你的账号</div></div>
  </div>

  <div class="flows">
    <div class="flow"><b>01</b>你导出 ZIP</div>
    <div class="fa">→</div>
    <div class="flow"><b>02</b>选对话</div>
    <div class="fa">→</div>
    <div class="flow"><b>03</b>补人设</div>
    <div class="fa">→</div>
    <div class="flow"><b>04</b>接着聊</div>
  </div>
  <div class="grow"></div>
</div>
<div class="bar">
  <div class="bl"><b>19.9</b> 起 · 三档可选</div>
  <div class="br">支持长对话 1000+ 条<br>附件 800+ 个实测</div>
</div>
</body></html>
